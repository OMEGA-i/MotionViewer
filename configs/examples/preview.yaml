task:
  mode: continuation

inputs:
  - path: ../../data/examples/smplx_body22_fitted_aa/omegamotiongpt.smplx.npz
    label: ours_150m
    format: smplx_body22_fitted_aa

timeline:
  show_prefix: true
  end_frame: 60

layout:
  mode: single
  alignment: start_root

body:
  backend: blender_smplx_addon
  gender: neutral
  neutral_hands_face: true

style:
  palette: soft_paper
  temporal_ramp: light_to_dark
  material_roughness: 0.5
  ghost_snapshots: 4
  prefix:
    mode: attached
    color: [0.74, 0.76, 0.76]
    ghost_count: 2
    show_marker: true
    transition_gap_frames: 0
  ghost:
    mode: trail
    include_prefix: false
    warmup_frames: 3
    start_lightness: 0.65
    end_lightness: 0.10
    alpha: 0.16
  labels:
    mode: legend
    show_instruction: false

ground:
  mode: trajectory_carpet
  opacity: 0.16
  carpet_padding: 0.4

camera:
  preset: three_quarter
  orthographic: true
  margin: 1.2

render:
  engine: BLENDER_EEVEE
  resolution: [1280, 720]
  samples: 32
  transparent_background: true
  frame_format: PNG

output:
  directory: ../../outputs/preview
  mp4_name: preview.mp4
  keep_frames: true
  overwrite: true
